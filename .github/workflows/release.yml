name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the extension did not change since the previous tag
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Check tag and changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the tag is a version on main
        run: |
          [[ "$GITHUB_REF" == refs/tags/v*.*.* ]] || { echo "::error::Run this on a vX.Y.Z tag, not $GITHUB_REF"; exit 1; }
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }

      - name: Compare with the previous tag
        id: changes
        env:
          FORCE: ${{ inputs.force }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*.*.*' "$GITHUB_SHA^" 2>/dev/null || true)
          if [ "$FORCE" = true ] || [ -z "$previous" ] ||
            ! git diff --quiet "$previous" "$GITHUB_SHA" -- src shared webview media package.json package-lock.json tsconfig.json .vscodeignore README.md LICENSE; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The extension did not change since $previous: nothing released for $GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build the VSIX
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      vsix: ${{ steps.package.outputs.vsix }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview/package-lock.json

      # The Marketplace takes plain X.Y.Z versions; the tag is the source of truth.
      - name: Set the version from the tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix webview ci

      - name: Check and test
        run: |
          npm --prefix webview run check
          npm run check
          npm test

      - name: Build
        run: npm run build

      # --no-dependencies: esbuild bundles everything but vscode into dist/extension.cjs.
      - name: Package
        id: package
        run: |
          vsix="codeflower-${GITHUB_REF_NAME#v}.vsix"
          npx --yes @vscode/vsce@4.1.0 package --no-dependencies -o "dist/$vsix"
          echo "vsix=$vsix" >> "$GITHUB_OUTPUT"

      - name: Check the package contents
        env:
          VSIX: dist/${{ steps.package.outputs.vsix }}
        run: |
          files=$(unzip -Z1 "$VSIX")
          for required in extension/dist/extension.cjs extension/webview/dist/index.html extension/package.json; do
            grep -qx "$required" <<< "$files" || { echo "::error::$required is missing from the package"; exit 1; }
          done
          if grep -qE '^extension/(src|shared|test|node_modules)/' <<< "$files"; then
            echo "::error::Sources or node_modules were packaged; check .vscodeignore"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: dist/${{ steps.package.outputs.vsix }}
          if-no-files-found: error

  github-release:
    name: Attach the VSIX to the GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here, so gh cannot infer the repository from a remote.
          GH_REPO: ${{ github.repository }}
          VSIX: dist/${{ needs.build.outputs.vsix }}
        run: |
          cat > notes.md <<NOTES
          Install the VSIX in VS Code with *Extensions → ⋯ → Install from VSIX…*, or:

          \`\`\`sh
          code --install-extension ${{ needs.build.outputs.vsix }}
          \`\`\`
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$VSIX" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$VSIX" --notes-file notes.md --generate-notes --verify-tag
          fi

  # Off until the repository variable PUBLISH_STORES is "true" (Settings → Secrets and
  # variables → Actions → Variables). To publish a release made while it was off, rerun
  # this workflow on its tag with "force".
  publish:
    name: Publish to the Marketplace and Open VSX
    needs: build
    if: vars.PUBLISH_STORES == 'true'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: dist

      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@4.1.0 publish --packagePath "dist/${{ needs.build.outputs.vsix }}" --skip-duplicate

      # The same VSIX as the Marketplace's, never repackaged.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@1.3.0 publish "dist/${{ needs.build.outputs.vsix }}" --skip-duplicate
