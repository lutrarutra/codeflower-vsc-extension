<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Working: a spinning cyan ring around the tulip's dot. -->
  <circle cx="32" cy="32" r="23" fill="none" stroke="#1ec8f0" stroke-opacity="0.3" stroke-width="10"/>
  <path d="M32 9a23 23 0 0 1 23 23" fill="none" stroke="#1ec8f0" stroke-width="10" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 32 32" to="360 32 32" dur="0.9s" repeatCount="indefinite"/>
  </path>
  <circle cx="32" cy="32" r="8" fill="#1ec8f0"/>
</svg>
